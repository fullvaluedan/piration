<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12203a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Piration — offline pirate RPG. Random monster encounters, loot, captains, ships, endless high-score mode. No energy, no servers." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Piration</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="skull">☠</span>
        <div>
          <h1>Piration</h1>
          <p class="sub">Offline pirate RPG · no energy · no servers</p>
        </div>
        <button class="help-btn" id="helpBtn" title="How to play">?</button>
      </div>
      <div id="stats" class="stats">Loading…</div>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="voyage" class="active">Voyage</button>
      <button data-tab="endless">Endless</button>
      <button data-tab="shipyard">Shipyard</button>
      <button data-tab="captains">Captains</button>
      <button data-tab="collection">Collection</button>
    </nav>

    <main id="content" class="content"></main>

    <div id="toast" class="toast hidden"></div>
    <footer class="foot">
      Offline · saves on device · inspired by Pirate Nation OSS (CC0/MIT)
    </footer>
  </div>
  <script src="js/ui.js" type="module"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
