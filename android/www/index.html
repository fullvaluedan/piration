<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12203a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Pirate Nation Archive Port — offline pirate RPG. Quests, card gauntlet, ships, crew." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Piration</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="skull">☠</span>
        <div>
          <h1>Piration</h1>
          <p class="sub">Pirate archive · Offline</p>
        </div>
      </div>
      <div id="stats" class="stats">Loading…</div>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="quests" class="active">Quests</button>
      <button data-tab="gauntlet">Gauntlet</button>
      <button data-tab="craft">Craft</button>
      <button data-tab="crew">Crew</button>
    </nav>

    <main id="content" class="content"></main>

    <div id="toast" class="toast hidden"></div>
    <footer class="foot">
      Offline · Piration · saves on device · CC0/MIT-inspired archive port
    </footer>
  </div>
  <script src="js/app.js" type="module"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
